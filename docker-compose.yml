services:
  nuxt:
    build: .
    container_name: koeduko-nuxt
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY}
      - NUXT_PUBLIC_BASE_URL=${NUXT_PUBLIC_BASE_URL}
      - NUXT_PUBLIC_GOOGLEID=${GOOGLE_CLIENT_ID}
      - NUXT_PUBLIC_GOOGLESECRET=${GOOGLE_CLIENT_SECRET}
      - NUXT_PUBLIC_GOOGLEREDURL=${GOOGLE_REDIRECT_URI}
      - NUXT_PUBLIC_URLSERVER=${NUXT_PUBLIC_URL_SERVER}
      - NUXT_API_KEY=${API_KEY}

  nginx:
    image: nginx:alpine
    container_name: koeduko-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nuxt
